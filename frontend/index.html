<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f9fc" />
  <title>IntentPay AI — Ödeme Yetkilendirme Katmanı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-soft: #f9fbfd;
      --surface-muted: #f2f5f8;
      --text: #172033;
      --text-soft: #5f6d82;
      --text-muted: #8a96a7;
      --line: #dce4ec;
      --line-soft: #edf1f5;
      --navy: #0d234a;
      --navy-hover: #132d5e;
      --mint: #18b88a;
      --mint-soft: #ebfaf5;
      --mint-line: #bdebdc;
      --amber: #e3a51d;
      --amber-soft: #fff8e5;
      --red: #e15361;
      --red-soft: #fff0f2;
      --blue: #3478dc;
      --blue-soft: #edf5ff;
      --shadow: 0 8px 28px rgba(23, 32, 51, .055);
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-w: 232px;
      --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'Inter', system-ui, sans-serif;

      --ink: var(--bg);
      --ink-2: var(--surface);
      --ink-3: var(--surface-soft);
      --paper: var(--text);
      --mist: var(--text-soft);
      --ghost: var(--text-muted);
      --approve: var(--mint);
      --approve-bg: var(--mint-soft);
      --stepup: var(--amber);
      --stepup-bg: var(--amber-soft);
      --review: var(--blue);
      --review-bg: var(--blue-soft);
      --decline: var(--red);
      --decline-bg: var(--red-soft);
      --amber-line: var(--mint-line);
      --display: var(--font);
      --body: var(--font);
      --r: var(--radius);
      --r-sm: var(--radius-sm);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body,
    #root {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    textarea {
      resize: vertical;
    }

    .mono {
      font-family: var(--mono);
    }

    .hidden {
      display: none !important;
    }

    .spacer {
      flex: 1;
    }

    .app-layout {
      min-height: 100vh;
      display: flex;
    }

    .workspace {
      min-width: 0;
      flex: 1;
      margin-left: var(--sidebar-w);
    }

    .shell {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 28px 24px 56px;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 70;
      width: var(--sidebar-w);
      padding: 22px 15px 18px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 24px;
      font-size: 20px;
    }

    .sidebar-brand strong {
      font-weight: 700;
      letter-spacing: -.035em;
    }

    .sidebar-brand strong span {
      color: var(--mint);
    }

    .logo {
      width: 30px;
      height: 34px;
      flex: none;
      position: relative;
      border: 2px solid #2bc99d;
      border-radius: 10px;
      background: #e9fbf5;
    }

    .logo::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 2px solid #2bc99d;
      border-radius: 7px;
    }

    .nav-group {
      margin-top: 18px;
    }

    .nav-label {
      padding: 0 13px 8px;
      color: #9aa4b2;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 13px;
      border-radius: 10px;
      color: #5e6a7d;
      font-size: 13px;
      text-align: left;
    }

    .nav-item:hover {
      background: #f5f8fa;
      color: #243047;
    }

    .nav-item.active {
      background: linear-gradient(90deg, #e9faf5, #effcf8);
      color: var(--text);
      font-weight: 600;
    }

    .nav-item:disabled {
      cursor: default;
      opacity: .48;
    }

    .nav-item:disabled:hover {
      background: transparent;
      color: #5e6a7d;
    }

    #overview, #intent-flow, #new-intent, #decision, #analytics, #audit {
      scroll-margin-top: 88px;
    }

    .sidebar-guard {
      margin-top: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcfd;
    }

    .sidebar-guard b,
    .sidebar-guard small {
      display: block;
    }

    .sidebar-guard b {
      font-size: 12px;
    }

    .sidebar-guard small {
      margin-top: 3px;
      color: var(--mint);
      font-size: 11px;
    }

    .guard-dot {
      width: 17px;
      height: 17px;
      position: relative;
      border: 2px solid var(--mint);
      border-radius: 50%;
    }

    .guard-dot::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--mint);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      margin: 0;
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      max-width: none;
      height: 68px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .search-box {
      width: min(395px, 42vw);
      height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .search-box span {
      color: #8792a3;
      font-size: 20px;
    }

    .search-box input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 12px;
    }

    .search-box kbd {
      color: #98a1af;
      font-size: 10px;
    }

    .mode-pill,
    .sim-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: #667286;
      font-size: 10.5px;
    }

    .sim-badge {
      color: var(--mint);
      background: var(--mint-soft);
      border-color: var(--mint-line);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
    }

    .dot.off {
      background: #aab2bf;
    }

    .notification {
      position: relative;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .notification span {
      position: absolute;
      right: 0;
      top: 0;
      min-width: 15px;
      height: 15px;
      display: grid;
      place-items: center;
      border-radius: 99px;
      background: #ef5560;
      color: white;
      font-size: 9px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 160px;
    }

    .user-card b,
    .user-card small {
      display: block;
    }

    .user-card b {
      font-size: 12px;
    }

    .user-card small {
      margin-top: 2px;
      color: #8b95a5;
      font-size: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f1d6c8;
      color: #684438;
      font-size: 11px;
      font-weight: 700;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0;
      margin-bottom: 24px;
      padding: 0 5px;
    }

    .step {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      color: #687386;
      font-size: 11px;
    }

    .step::after {
      content: '';
      position: absolute;
      left: 41px;
      right: -4px;
      top: 18px;
      z-index: -1;
      height: 1px;
      background: #dce3e9;
    }

    .step:last-child::after {
      display: none;
    }

    .step .n {
      width: 29px;
      height: 29px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid #cfd7e0;
      border-radius: 50%;
      background: #fff;
      color: #6c7789;
      font-size: 11px;
    }

    .step.active {
      color: var(--text);
      font-weight: 600;
    }

    .step.active .n {
      border: 2px solid #2769bf;
      color: #2769bf;
    }

    .step.done {
      color: var(--text);
    }

    .step.done .n {
      border-color: var(--mint);
      background: var(--mint);
      color: #fff;
    }

    /* Workflow layout */
    .dashboard-grid {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1.08fr);
      grid-template-areas:
        'intent mandate agent'
        'decision decision decision';
      gap: 16px;
      align-items: start;
    }

    .dashboard-grid>.dash-cell {
      width: 100%;
      min-width: 0;
    }

    .dashboard-grid>.dash-cell>.panel {
      width: 100%;
    }

    .intent-cell {
      grid-area: intent;
    }

    .mandate-cell {
      grid-area: mandate;
    }

    .agent-cell {
      grid-area: agent;
    }

    .decision-cell {
      grid-area: decision;
    }

    .dashboard-grid.pre-agent-stage {
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1.08fr);
      grid-template-areas:
        'intent mandate agent'
        'decision decision decision';
    }

    .dashboard-grid.agent-stage,
    .shell:has(.step:nth-child(3).active) .dashboard-grid,
    .shell:has(.step:nth-child(4).active) .dashboard-grid,
    .shell:has(.step:nth-child(5).active) .dashboard-grid,
    .shell:has(.step:nth-child(6).active) .dashboard-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas:
        'intent mandate'
        'agent agent'
        'decision decision';
    }

    .dashboard-grid.agent-stage .intent-cell,
    .dashboard-grid.agent-stage .mandate-cell,
    .shell:has(.step:nth-child(n+3).active) .intent-cell,
    .shell:has(.step:nth-child(n+3).active) .mandate-cell {
      align-self: stretch;
    }

    .dashboard-grid.agent-stage .intent-cell>.panel,
    .dashboard-grid.agent-stage .mandate-cell>.panel,
    .shell:has(.step:nth-child(n+3).active) .intent-cell>.panel,
    .shell:has(.step:nth-child(n+3).active) .mandate-cell>.panel {
      height: 100%;
    }

    .dashboard-grid.agent-stage .agent-cell,
    .shell:has(.step:nth-child(n+3).active) .agent-cell,
    .dashboard-grid .decision-cell {
      grid-column: 1 / -1;
    }

    .dashboard-grid.agent-stage .agent-cell .panel-b,
    .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b {
      display: grid;
      grid-template-columns: minmax(280px, .72fr) minmax(460px, 1.28fr);
      gap: 16px;
      align-items: start;
    }

    .dashboard-grid.agent-stage .agent-cell .panel-b> :nth-child(1),
    .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b> :nth-child(1) {
      grid-column: 1;
      grid-row: 1;
    }

    .dashboard-grid.agent-stage .agent-cell .panel-b> :nth-child(2),
    .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b> :nth-child(2) {
      grid-column: 1;
      grid-row: 2;
    }

    .dashboard-grid.agent-stage .agent-cell .panel-b> :nth-child(3),
    .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b> :nth-child(3) {
      grid-column: 2;
      grid-row: 1 / span 2;
    }

    .dashboard-grid.agent-stage .agent-cell .panel-b> :nth-child(4),
    .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b> :nth-child(4) {
      grid-column: 1 / -1;
      grid-row: 3;
    }

    .dashboard-grid.agent-stage .compact-scenarios,
    .shell:has(.step:nth-child(n+3).active) .compact-scenarios {
      width: 100%;
      max-height: none;
      overflow: visible;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .dashboard-grid.agent-stage .guided-demo,
    .shell:has(.step:nth-child(n+3).active) .guided-demo {
      width: 100%;
    }

    .panel {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .panel-h {
      min-height: 72px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .panel-h .eyebrow {
      color: #182237;
      font-size: 13px;
      font-weight: 700;
    }

    .panel-h h2 {
      margin-top: 2px;
      font-size: 14px;
      letter-spacing: -.015em;
    }

    .panel-h p {
      margin-top: 6px;
      color: #8b95a4;
      font-size: 10.5px;
      line-height: 1.45;
    }

    /* Panel başlık hiyerarşisi: üst etiket ve ana başlık artık birbirine karışmaz. */
    .panel-h > div:first-child {
      min-width: 0;
      display: grid;
      align-content: center;
      row-gap: 3px;
    }

    .panel-h .eyebrow {
      margin: 0;
      color: #718096;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .panel-h h2 {
      margin: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -.018em;
    }

    .panel-h .mode-pill {
      flex: none;
      align-self: flex-start;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .mandate-cell .panel-h {
      border-left: 3px solid var(--mint);
      padding-left: 15px;
    }

    .agent-cell .panel-h {
      border-left: 3px solid var(--blue);
      padding-left: 15px;
    }

    .panel-b {
      padding: 16px;
    }

    label.fld {
      display: block;
      margin-bottom: 8px;
      color: #7b8797;
      font-size: 10px;
    }

    textarea,
    input.txt {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce3e9;
      border-radius: 9px;
      outline: 0;
      background: #fff;
      color: #273349;
      font-size: 11px;
      line-height: 1.55;
    }

    textarea:focus,
    input.txt:focus {
      border-color: #52cfa9;
      box-shadow: 0 0 0 3px #e8faf4;
    }

    textarea::placeholder,
    input::placeholder {
      color: #a1aab7;
    }

    .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      transition: .18s ease;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--navy);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--navy-hover);
    }

    .btn-ghost {
      border-color: #dce3e9;
      background: #fff;
      color: #3d4b60;
    }

    .btn-ghost:hover:not(:disabled) {
      background: #f7f9fb;
    }

    .btn-sm {
      min-height: 32px;
      padding: 7px 11px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-row.compact-actions {
      margin-top: 12px;
    }

    .muted {
      color: #8a95a5;
      font-size: 10px;
    }

    .ex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .chip {
      padding: 5px 8px;
      border: 1px solid #e2e7ec;
      border-radius: 999px;
      background: #f8fafb;
      color: #667286;
      font-size: 9.5px;
    }

    .chip:hover {
      border-color: var(--mint-line);
      color: #1f6e59;
    }

    .chip-attack {
      border-color: #f2c9ce;
      background: #fff5f6;
      color: #cf4d59;
    }

    .rules {
      display: grid;
      grid-template-columns: 1fr;
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
    }

    .rule {
      min-height: 39px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      align-items: center;
      padding: 8px 11px;
      border-bottom: 1px solid var(--line-soft);
      background: #fff;
    }

    .rule:last-child {
      border-bottom: 0;
    }

    .rule .k {
      color: #7e8998;
      font-size: 9.5px;
    }

    .rule .v {
      text-align: right;
      font-size: 10.5px;
    }

    .rule .v.amber {
      color: #243047;
    }

    .rule .tags {
      justify-content: flex-end;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 8.5px;
    }

    .tag.allow {
      border-color: #cfefe5;
      background: var(--mint-soft);
      color: #218568;
    }

    .tag.block {
      border-color: #f4d1d5;
      background: var(--red-soft);
      color: #d24d59;
    }

    .tag.warn {
      border-color: #f0d899;
      background: var(--amber-soft);
      color: #a87812;
    }

    .notice {
      margin-top: 16px;
      padding: 12px 15px;
      display: flex;
      gap: 10px;
      border: 1px solid #d2efe6;
      border-radius: 10px;
      background: #effbf7;
      color: #45685d;
      font-size: 10px;
    }

    .notice .i {
      color: var(--mint);
    }

    .empty-state {
      min-height: 195px;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 9px;
      text-align: center;
      color: #96a0af;
    }

    .empty-state span {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #dce3e9;
      border-radius: 50%;
      background: #fafbfc;
      font-weight: 700;
    }

    .empty-state p {
      max-width: 190px;
      font-size: 11px;
    }

    .agent-line {
      margin-bottom: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #e5eaf0;
      border-radius: 10px;
      background: #fbfcfd;
    }

    .agent-line .av {
      width: 32px;
      height: 32px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #f1f4f8;
    }

    .agent-line .info {
      flex: 1;
      min-width: 0;
    }

    .agent-line .nm {
      font-size: 11px;
      font-weight: 600;
    }

    .agent-line .sub {
      color: var(--text-soft);
      font-size: 9px;
    }

    .agent-line .trust {
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 9px;
    }

    .trust.high {
      border-color: #caece1;
      background: #effbf7;
      color: #218568;
    }

    .trust.low {
      border-color: #f0cbd0;
      background: #fff3f4;
      color: var(--red);
    }

    .risk-profile {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #e7ebf0;
      border-radius: 10px;
      background: #fbfcfd;
    }

    .rp-h {
      margin-bottom: 9px;
    }

    .rp-title {
      display: block;
      font-size: 11px;
      font-weight: 600;
    }

    .rp-sub {
      display: block;

    .tl-item.step_up .tl-dot {
      background: var(--amber);
    }

    .tl-item.review .tl-dot {
      background: var(--blue);
    }

    .tl-item.denied .tl-dot {
      background: var(--red);
    }

    .tl-main {
      flex: 1;
      min-width: 0;
    }

    .tl-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
    }

    .tl-mid,
    .tl-sub {
      margin-top: 4px;
      color: var(--text-soft);
      font-size: 9px;
    }

    .audit-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .audit-kpi b {
      display: block;
      font-size: 20px;
    }

    .audit-kpi span {
      color: var(--text-muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .audit-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 14px;
    }

    .audit-filter {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text-soft);
      font-size: 9px;
    }

    .audit-filter.active {
      border-color: var(--mint-line);
      background: var(--mint-soft);
      color: #218568;
    }

    .audit-item {
      margin-bottom: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .audit-head {
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .audit-head:hover {
      background: #f8fafb;
    }

    .vbadge {
      padding: 5px 8px;
      border: 1px solid;
      border-radius: 6px;
      font-size: 9px;
    }

    .vbadge.approve {
      border-color: #caece1;
      background: var(--mint-soft);
      color: #218568;
    }

    .vbadge.step-up {
      border-color: #f2dfaa;
      background: var(--amber-soft);
      color: #a87812;
    }

    .vbadge.review {
      border-color: #cfe0f7;
      background: var(--blue-soft);
      color: var(--blue);
    }

    .vbadge.decline {
      border-color: #f0cbd0;
      background: var(--red-soft);
      color: var(--red);
    }

    .audit-head .ax {
      flex: 1;
      min-width: 0;
    }

    .axt {
      font-size: 10px;
      font-weight: 600;
    }

    .axe {
      color: var(--text-soft);
      font-size: 9px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .audit-mini {
      display: flex;
      gap: 6px;
    }

    .audit-mini span {
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 8px;
    }

    .audit-explain,
    .audit-body {
      padding: 11px 15px;
      border-top: 1px solid var(--line-soft);
      background: #fbfcfd;
      color: var(--text-soft);
      font-size: 9px;
    }

    .audit-body {
      display: none;
    }

    .audit-item.open .audit-body {
      display: block;
    }

    .audit-empty {
      padding: 42px 18px;
      text-align: center;
      color: var(--text-muted);
      font-size: 10px;
    }

    .event-source {
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .es-head {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
    }

    .es-kicker {
      margin-bottom: 4px;
      color: #1f8064;
      font-size: 8px;
      text-transform: uppercase;
    }

    .es-head h3 {
      font-size: 15px;
    }

    .es-head p {
      margin-top: 4px;
      color: var(--text-soft);
      font-size: 9px;
    }

    .es-count {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #1f8064;
      font-size: 9px;
    }

    .es-item {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
    }

    .es-left {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .es-dot {
      width: 24px;
      height: 24px;
      z-index: 2;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--text-soft);
      font-size: 9px;
    }

    .es-line {
      position: absolute;
      top: 24px;
      bottom: -12px;
      width: 1px;
      background: var(--line);
    }

    .es-card {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .es-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .es-top b {
      display: block;
      font-size: 10px;
    }

    .es-top span,
    .es-top time {
      color: var(--text-muted);
      font-size: 8px;
    }

    .es-io {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .es-io div {
      padding: 9px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .es-io span,
    .es-reason span {
      display: block;
      margin-bottom: 3px;
      color: var(--text-muted);
      font-size: 8px;
      text-transform: uppercase;
    }

    .es-io b,
    .es-reason p {
      color: var(--text-soft);
      font-size: 9px;
    }

    .es-reason {
      margin-top: 9px;
      padding-left: 9px;
      border-left: 3px solid var(--line);
    }

    .stepup-dialog,
    .stepup-result {
      margin-top: 18px;
      padding: 15px;
      border: 1px solid #f2dfaa;
      border-radius: 10px;
      background: var(--amber-soft);
    }

    .stepup-q {
      display: flex;
      gap: 11px;
    }

    .stepup-ico {
      width: 30px;
      height: 30px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #fff0be;
      color: var(--amber);
      font-weight: 700;
    }

    .stepup-result.ok {
      border-color: #c8ebdf;
      background: var(--mint-soft);
      color: #218568;
    }

    .stepup-result.bad {
      border-color: #f0cbd0;
      background: var(--red-soft);
      color: var(--red);
    }

    .overview-actions {
      margin: 17px 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .trust-bar {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1.6fr repeat(4, 1fr);
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .trust-bar>div {
      min-height: 66px;
      padding: 13px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid var(--line-soft);
    }

    .trust-bar>div:last-child {
      border-right: 0;
    }

    .trust-bar b {
      font-size: 10px;
    }

    .trust-bar span {
      margin-top: 4px;
      color: #218568;
      font-size: 9px;
    }

    .trust-bar>div:first-child span {
      color: #8994a4;
    }

    .foot {
      margin-top: 18px;
      text-align: center;
      color: #a0a9b6;
      font-size: 9px;
    }

    .modal-layer,
    .threat-modal-layer,
    .mandate-modal-layer {
      position: fixed;
      inset: 0;
      z-index: 99990;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .security-modal-layer,
    .threat-modal-layer {
      z-index: 100000;
    }

    .modal-scrim,
    .threat-modal-backdrop,
    .mandate-modal-backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: rgba(15, 23, 42, .56);
      backdrop-filter: blur(5px);
    }

    .threat-modal,
    .security-modal {
      position: relative;
      z-index: 1;
      width: min(640px, 100%);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 18px;
      padding: 26px;
      border: 1px solid #fecaca;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(15, 23, 42, .24);
      animation: modalIn .18s ease-out;
    }

    .threat-modal-close,
    .modal-close,
    .mandate-modal-close {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: #f4f7fa;
      color: #64748b;
      font-size: 24px;
    }

    .threat-modal-close,
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
    }

    .threat-modal-close:hover,
    .modal-close:hover,
    .mandate-modal-close:hover {
      background: #e9eef4;
      color: var(--text);
    }

    .threat-modal-icon,
    .security-modal-icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #fee2e2;
      color: #dc2626;
      font-size: 28px;
      font-weight: 700;
    }

    .threat-modal-content {
      min-width: 0;
      padding-right: 20px;
    }

    .threat-modal-kicker,
    .security-alert-kicker {
      margin-bottom: 7px;
      color: #dc2626;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .threat-modal-content h2,
    .security-modal .sec-title {
      margin: 0;
      color: var(--text);
      font-size: 23px;
      line-height: 1.2;
    }

    .threat-modal-level {
      display: inline-flex;
      margin-top: 10px;
      padding: 5px 9px;
      border: 1px solid #fecaca;
      border-radius: 999px;
      background: #fff1f2;
      color: #be123c;
      font-size: 10px;
      font-weight: 700;
    }

    .threat-modal-summary,
    .security-modal .sec-sub {
      margin-top: 14px;
      color: #475569;
      font-size: 13px;
      line-height: 1.6;
    }

    .threat-modal-detections,
    .security-modal .sec-detections {
      margin-top: 16px;
      display: grid;
      gap: 9px;
    }

    .threat-modal-detection,
    .security-modal .sec-det {
      padding: 12px 13px;
      display: grid;
      gap: 4px;
      border: 1px solid #fecaca;
      border-radius: 11px;
      background: #fff7f7;
    }

    .threat-modal-detection b,
    .security-modal .sec-det-label {
      color: #b91c1c;
      font-size: 11px;
    }

    .threat-modal-detection span,
    .security-modal .sec-det-match {
      color: #475569;
      font-size: 12px;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .threat-modal-defense,
    .security-modal .sec-defense {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }

    .threat-modal-actions,
    .security-modal-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }

    .mandate-modal {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #dbe4ee;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 34px 90px rgba(15, 23, 42, .24);
      animation: modalIn .18s ease-out;
    }

    .mandate-modal-header {
      flex: none;
      padding: 22px 24px 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      border-bottom: 1px solid #e7edf4;
    }

    .mandate-modal-kicker {
      margin-bottom: 6px;
      color: #0f9f75;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .mandate-modal-header h2 {
      font-size: 22px;
    }

    .mandate-modal-header p {
      max-width: 680px;
      margin-top: 7px;
      color: #64748b;
      font-size: 12px;
    }

    .mandate-modal-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 24px 24px;
      background: #f7f9fc;
    }

    .mandate-modal .mandate-editor,
    .mandate-modal-layer .mandate-editor {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .mandate-modal .me-head {
      display: none;
    }

    .mandate-editor {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .me-head {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .me-kicker {
      margin-bottom: 5px;
      color: #0f9f75;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .me-head h3 {
      font-size: 16px;
    }

    .me-head p {
      margin-top: 5px;
      color: var(--text-soft);
      font-size: 10px;
    }

    .me-pill {
      padding: 6px 9px;
      border: 1px solid var(--mint-line);
      border-radius: 999px;
      background: var(--mint-soft);
      color: #1f8064;
      font-size: 9px;
    }

    .me-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .me-field span {
      display: block;
      margin-bottom: 6px;
      color: #64748b;
      font-size: 10px;
    }

    .me-field input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #dbe4ee;
      border-radius: 10px;
      outline: 0;
      background: #fff;
      color: var(--text);
      -webkit-text-fill-color: var(--text);
      caret-color: var(--text);
    }

    .me-field input:focus {
      border-color: #0f9f75;
      box-shadow: 0 0 0 3px rgba(15, 159, 117, .12);
    }

    .me-section {
      margin-top: 16px;
    }

    .me-title {
      margin-bottom: 8px;
      color: #64748b;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .me-cats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .me-cat {
      padding: 8px 11px;
      border: 1px solid #dbe4ee;
      border-radius: 999px;
      background: #fff;
      color: #475569;
    }

    .me-cat.allow.active {
      border-color: #a7f3d0;
      background: #ecfdf5;
      color: #047857;
    }

    .me-cat.block.active {
      border-color: #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }

    .me-toggles {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .me-toggle {
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid #dbe4ee;
      border-radius: 12px;
      background: #fff;
    }

    .me-toggle b {
      display: block;
      color: var(--text);
      font-size: 11px;
    }

    .me-toggle small {
      display: block;
      margin-top: 3px;
      color: #64748b;
      font-size: 9px;
    }

    .me-error,
    .me-saved {
      margin-top: 13px;
      padding: 10px 11px;
      border-radius: 10px;
      font-size: 10px;
    }

    .me-error {
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }

    .me-saved {
      border: 1px solid #a7f3d0;
      background: #ecfdf5;
      color: #047857;
    }

    .mandate-editor-actions {
      position: sticky;
      bottom: -24px;
      z-index: 2;
      margin: 22px -24px -24px;
      padding: 16px 24px;
      border-top: 1px solid #dbe4ee;
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(10px);
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .spin {
      width: 14px;
      height: 14px;
      display: inline-block;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fade-in {
      animation: fade .28s ease both;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .kbd {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #f7f9fb;
      color: var(--text-soft);
      font-size: 10px;
    }

    @media (max-width: 1280px) {

      .dashboard-grid.agent-stage .agent-cell .panel-b,
      .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b {
        grid-template-columns: minmax(250px, .8fr) minmax(380px, 1.2fr);
      }

      .dashboard-grid.agent-stage .compact-scenarios,
      .shell:has(.step:nth-child(n+3).active) .compact-scenarios {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1100px) {

      .dashboard-grid,
      .dashboard-grid.pre-agent-stage,
      .dashboard-grid.agent-stage {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-areas:
          'intent mandate'
          'agent agent'
          'decision decision';
      }

      .dashboard-grid.agent-stage .agent-cell .panel-b,
      .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b {
        display: block;
      }

      .dashboard-grid.agent-stage .agent-cell .panel-b>*+*,
      .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b>*+* {
        margin-top: 12px;
      }

      .dashboard-grid.agent-stage .compact-scenarios,
      .shell:has(.step:nth-child(n+3).active) .compact-scenarios {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .analytics-visual-grid {
        grid-template-columns: 1fr;
      }

      .an-donut-card {
        grid-template-columns: 1fr;
      }

      .donut-wrap {
        justify-self: start;
      }

      .kpi-grid-5 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .trust-bar {
        grid-template-columns: 1fr 1fr;
      }

      .trust-bar>div {
        border-bottom: 1px solid var(--line-soft);
      }
    }

    @media (max-width: 900px) {

      .pd-head,
      .es-head,
      .es-top {
        flex-direction: column;
      }

      .pd-row {
        grid-template-columns: 1fr;
      }

      .pd-row-head {
        display: none;
      }

      .gd-flow {
        grid-template-columns: 1fr;
      }

      .guided-demo {
        grid-template-columns: 1fr;
      }

      .me-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .workspace {
        margin-left: 0;
      }

      .shell {
        padding: 20px 14px 42px;
      }

      .dashboard-grid,
      .dashboard-grid.pre-agent-stage,
      .dashboard-grid.agent-stage {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          'intent'
          'mandate'
          'agent'
          'decision';
      }

      .dashboard-grid.agent-stage .intent-cell>.panel,
      .dashboard-grid.agent-stage .mandate-cell>.panel,
      .shell:has(.step:nth-child(n+3).active) .intent-cell>.panel,
      .shell:has(.step:nth-child(n+3).active) .mandate-cell>.panel {
        height: auto;
      }

      .dashboard-grid.agent-stage .agent-cell .panel-b,
      .shell:has(.step:nth-child(n+3).active) .agent-cell .panel-b {
        display: block;
      }

      .dashboard-grid.agent-stage .compact-scenarios,
      .shell:has(.step:nth-child(n+3).active) .compact-scenarios {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stepper {
        overflow-x: auto;
        grid-template-columns: repeat(6, minmax(120px, 1fr));
      }

      .topbar-inner {
        padding: 0 14px;
      }

      .search-box {
        width: 45vw;
      }

      .user-card>div:nth-child(2),
      .mode-pill {
        display: none;
      }

      .trust-bar {
        grid-template-columns: 1fr;
      }

      .token .t-grid,
      .risk-dist,
      .kpi-grid {
        grid-template-columns: 1fr 1fr;
      }

      .modal-layer,
      .threat-modal-layer,
      .mandate-modal-layer {
        padding: 12px;
      }

      .threat-modal,
      .security-modal {
        width: 100%;
        grid-template-columns: 1fr;
        padding: 22px 18px;
      }

      .mandate-modal {
        width: 100%;
        max-height: calc(100vh - 24px);
        border-radius: 18px;
      }

      .mandate-modal-header,
      .mandate-modal-body {
        padding-left: 18px;
        padding-right: 18px;
      }

      .threat-modal-content {
        padding-right: 0;
      }
    }

    @media (max-width: 620px) {
      .dashboard-grid {
        gap: 14px;
      }

      .dashboard-grid .compact-scenarios,
      .rp-opts,
      .me-grid,
      .me-toggles,
      .token .t-grid,
      .risk-dist,
      .kpi-grid,
      .kpi-grid-5,
      .es-io {
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        gap: 8px;
      }

      .search-box {
        width: 100%;
      }

      .notification,
      .user-card {
        display: none;
      }

      .pipe {
        flex-direction: column;
      }

      .pipe-stage+.pipe-stage {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .risk-card {
        align-items: flex-start;
        flex-direction: column;
      }

      .pd-score {
        flex-wrap: wrap;
      }

      .mandate-editor-actions {
        bottom: -18px;
        margin: 20px -18px -18px;
        padding: 15px 18px;
      }

      .mandate-editor-actions .btn,
      .threat-modal-actions .btn {
        width: 100%;
      }
    }

    /* =========================================================
   AUDIT DETAIL — Görsel işlem karar zinciri
   ========================================================= */

    .audit-body {
      padding: 22px;
      background: #f8fafc;
    }

    .audit-chain {
      position: relative;
      display: grid;
      gap: 0;
    }

    /* Her audit aşaması */
    .chain-step {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 14px;
      position: relative;
    }

    .chain-line {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .chain-line::after {
      content: "";
      position: absolute;
      top: 38px;
      bottom: 0;
      width: 2px;
      background: #e2e8f0;
    }

    .chain-step:last-child .chain-line::after {
      display: none;
    }

    .chain-dot {
      position: relative;
      z-index: 2;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      background: #ffffff;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 0 0 5px #f8fafc;
    }

    /* Aşama renkleri */
    .chain-step.info .chain-dot {
      border-color: #93c5fd;
      background: #eff6ff;
      color: #2563eb;
    }

    .chain-step.policy .chain-dot {
      border-color: #6ee7b7;
      background: #ecfdf5;
      color: #047857;
    }

    .chain-step.risk .chain-dot {
      border-color: #fcd34d;
      background: #fffbeb;
      color: #b45309;
    }

    .chain-step.decision .chain-dot {
      border-color: #5eead4;
      background: #f0fdfa;
      color: #0f766e;
    }

    .chain-step.token .chain-dot {
      border-color: #86efac;
      background: #f0fdf4;
      color: #15803d;
    }

    .chain-step.stepup .chain-dot {
      border-color: #fdba74;
      background: #fff7ed;
      color: #c2410c;
    }

    .chain-step.danger .chain-dot {
      border-color: #fca5a5;
      background: #fef2f2;
      color: #dc2626;
    }

    /* Audit kartı */
    .chain-card {
      min-width: 0;
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid #dce4ec;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.035);
    }

    .chain-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 17px;
      border-bottom: 1px solid #edf1f5;
      background: #fbfcfe;
    }

    .chain-top>div {
      min-width: 0;
    }

    .chain-top b {
      display: block;
      margin: 0;
      color: #172033;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .chain-top span {
      display: block;
      margin-top: 4px;
      color: #78869a;
      font-size: 10px;
      line-height: 1.45;
    }

    .chain-top em {
      flex: none;
      padding: 5px 8px;
      border: 1px solid #dce4ec;
      border-radius: 999px;
      background: #ffffff;
      color: #8491a4;
      font-size: 8px;
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* Kart içeriği */
    .audit-detail {
      padding: 16px 17px 18px;
      color: #536176;
      font-size: 11px;
      line-height: 1.55;
    }

    /* İşlem talebi bilgileri */
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .detail-grid>div,
    .token-box>div {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #e5eaf0;
      border-radius: 10px;
      background: #f9fbfd;
    }

    .detail-grid span,
    .token-box span {
      display: block;
      margin-bottom: 4px;
      color: #8a96a7;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .detail-grid b,
    .token-box b {
      display: block;
      overflow-wrap: anywhere;
      color: #243047;
      font-size: 10.5px;
      font-weight: 600;
    }

    .detail-note {
      margin-top: 10px;
      padding: 10px 12px;
      border-left: 3px solid #cbd5e1;
      border-radius: 0 8px 8px 0;
      background: #f8fafc;
      color: #64748b;
      font-size: 10px;
    }

    /* Policy özeti */
    .policy-summary {
      display: grid;
      grid-template-columns: minmax(150px, 1.4fr) repeat(3, minmax(90px, 0.65fr));
      gap: 8px;
      margin-bottom: 13px;
    }

    .policy-summary>span {
      padding: 9px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      background: #f8fafc;
      color: #64748b;
      font-size: 9px;
      text-align: center;
    }

    .policy-summary>span:first-child {
      text-align: left;
    }

    .policy-summary b {
      color: #172033;
    }

    /* Policy rule chip alanı */
    .audit-rules {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .audit-rules .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 27px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 500;
      line-height: 1.2;
      white-space: normal;
    }

    .audit-rules .tag.allow {
      border: 1px solid #bdebdc;
      background: #ebfaf5;
      color: #16785f;
    }

    .audit-rules .tag.warn {
      border: 1px solid #f2d691;
      background: #fff8e5;
      color: #9a6811;
    }

    .audit-rules .tag.block {
      border: 1px solid #f2c5cb;
      background: #fff0f2;
      color: #cc4350;
    }

    /* İhlal ve uyarı açıklamaları */
    .rule-reasons {
      display: grid;
      gap: 7px;
      margin-top: 12px;
    }

    .reason {
      padding: 9px 11px;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      background: #f8fafc;
      font-size: 10px;
      line-height: 1.5;
    }

    .reason.bad {
      border-color: #fecdd3;
      background: #fff1f2;
      color: #be123c;
    }

    .reason.warn {
      border-color: #fde68a;
      background: #fffbeb;
      color: #a16207;
    }

    .reason.info {
      border-color: #dbeafe;
      background: #f8fbff;
      color: #475569;
    }

    /* Risk modeli */
    .risk-audit-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding: 11px 12px;
      border: 1px solid #e5eaf0;
      border-radius: 10px;
      background: #f9fbfd;
    }

    .risk-audit-head b {
      color: #172033;
    }

    .risk-mode {
      flex: none;
      padding: 5px 8px;
      border: 1px solid #dbeafe;
      border-radius: 999px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 8px;
      font-weight: 600;
    }

    .risk-factor-list {
      display: grid;
      gap: 11px;
    }

    .risk-factor-row {
      min-width: 0;
    }

    .rf-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
      color: #64748b;
      font-size: 9.5px;
    }

    .rf-top b {
      color: #243047;
    }

    .rf-bar {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf1f5;
    }

    .rf-bar i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2dc99c, #18b88a);
      transition: width 0.35s ease;
    }

    /* Nihai karar */
    .decision-line {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid #bdebdc;
      border-radius: 10px;
      background: #ebfaf5;
    }

    .decision-line b {
      padding: 4px 8px;
      border-radius: 999px;
      background: #d8f6ec;
      color: #08785a;
      font-size: 9px;
      white-space: nowrap;
    }

    .decision-line span {
      color: #416459;
      font-size: 10px;
      line-height: 1.55;
    }

    /* Token alanı */
    .token-box {
      display: grid;
      grid-template-columns: 1.5fr 0.8fr 0.8fr;
      gap: 10px;
    }

    .token-box>div {
      border-color: #bdebdc;
      background: #f4fdf9;
    }

    .token-box span {
      color: #57917f;
    }

    .token-box b {
      color: #166b55;
    }

    /* Step-up sonucu */
    .stepup-resolution {
      padding: 12px;
      border: 1px solid #f2d691;
      border-radius: 10px;
      background: #fff8e5;
      color: #98670f;
      font-weight: 600;
    }

    .stepup-resolution span {
      display: block;
      margin-top: 5px;
      color: #7c6b49;
      font-size: 10px;
      font-weight: 400;
    }

    .stepup-resolution.ok {
      border-color: #bdebdc;
      background: #ebfaf5;
      color: #08785a;
    }

    .stepup-resolution.bad {
      border-color: #f2c5cb;
      background: #fff0f2;
      color: #be3342;
    }

    /* Mobil görünüm */
    @media (max-width: 900px) {
      .detail-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .policy-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .token-box {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 620px) {
      .audit-body {
        padding: 14px 10px;
      }

      .chain-step {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 8px;
      }

      .chain-dot {
        width: 28px;
        height: 28px;
        font-size: 10px;
      }

      .chain-line::after {
        top: 32px;
      }

      .chain-card {
        margin-bottom: 14px;
      }

      .chain-top {
        flex-direction: column;
        padding: 13px;
      }

      .chain-top em {
        align-self: flex-start;
      }

      .audit-detail {
        padding: 13px;
      }

      .detail-grid,
      .policy-summary,
      .token-box {
        grid-template-columns: 1fr;
      }

      .decision-line {
        grid-template-columns: 1fr;
      }

      .audit-rules .tag {
        width: 100%;
        border-radius: 8px;
      }

      .risk-audit-head {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>

</html>
